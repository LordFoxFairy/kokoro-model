services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: kokoro
      MYSQL_USER: kokoro_app
      MYSQL_PASSWORD: kokoro_local
      MYSQL_ROOT_PASSWORD: kokoro_root_local
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u kokoro_app -pkokoro_local --silent"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  model-migrate:
    build: .
    environment:
      DATABASE_URL_MODEL: mysql://kokoro_app:kokoro_local@mysql:3306/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm db:migrate

  model-http:
    build: .
    environment:
      DATABASE_URL_MODEL: mysql://kokoro_app:kokoro_local@mysql:3306/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
      KOKORO_MODEL_HTTP_PORT: "4221"
    depends_on:
      model-migrate:
        condition: service_completed_successfully
    ports:
      - "4221:4221"
    command: pnpm http:dev

  model-rpc:
    build: .
    environment:
      DATABASE_URL_MODEL: mysql://kokoro_app:kokoro_local@mysql:3306/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
      KOKORO_MODEL_RPC_PORT: "4222"
    depends_on:
      model-migrate:
        condition: service_completed_successfully
    ports:
      - "4222:4222"
    command: pnpm rpc:dev
