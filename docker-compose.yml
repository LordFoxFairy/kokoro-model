services:
  postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kokoro
      POSTGRES_USER: kokoro_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kokoro_local}
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U kokoro_app -d kokoro"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  model-migrate:
    build:
      context: .
      target: build
    environment:
      DATABASE_URL_MODEL: postgresql://kokoro_app:${POSTGRES_PASSWORD:-kokoro_local}@postgresql:5432/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm db:migrate

  model-http:
    build: .
    environment:
      DATABASE_URL_MODEL: postgresql://kokoro_app:${POSTGRES_PASSWORD:-kokoro_local}@postgresql:5432/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
      KOKORO_MODEL_HTTP_PORT: "4221"
      KOKORO_INTERNAL_SECRET_AGENT: ${KOKORO_INTERNAL_SECRET_AGENT:-kokoro-local-agent}
      KOKORO_INTERNAL_SECRET_ADMIN: ${KOKORO_INTERNAL_SECRET_ADMIN:-kokoro-local-admin}
      KOKORO_INTERNAL_SECRET_WEB_BFF: ${KOKORO_INTERNAL_SECRET_WEB_BFF:-kokoro-local-web-bff}
    depends_on:
      model-migrate:
        condition: service_completed_successfully
    ports:
      - "4221:4221"
    command: pnpm start

  model-rpc:
    build: .
    environment:
      DATABASE_URL_MODEL: postgresql://kokoro_app:${POSTGRES_PASSWORD:-kokoro_local}@postgresql:5432/kokoro
      KOKORO_REDIS_URL: redis://redis:6379
      KOKORO_MODEL_RPC_PORT: "4222"
    depends_on:
      model-migrate:
        condition: service_completed_successfully
    ports:
      - "4222:4222"
    command: pnpm start:rpc
